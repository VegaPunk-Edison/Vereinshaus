<!DOCTYPE html>
<html lang="de">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, shrink-to-fit=no">
<title>Kadermeister – Verein · Kader · Aufstellung</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Oswald:wght@400;500;600;700&family=Work+Sans:wght@400;500;600&family=JetBrains+Mono:wght@500;700&display=swap" rel="stylesheet">
<style>
  :root{
    --pitch-deep:#132a1f;
    --pitch-mid:#1e4632;
    --pitch-light:#265539;
    --ink:#0c1712;
    --ink-2:#14231b;
    --chalk:#eef3ea;
    --chalk-dim:#b9c7bd;
    --paper:#eef2ea;
    --paper-2:#e2e9dd;
    --gold:#e3b23c;
    --gold-dim:#8a6a24;
    --clay:#b8434f;
    --clay-dim:#6e2830;
    --line:#33493c;
    --radius:10px;
    --shadow:0 10px 30px -12px rgba(0,0,0,.55);
  }
  *{box-sizing:border-box;}
  html,body{margin:0;padding:0;height:100%;width:100%;}
  html{background:var(--ink);}
  body{
    background:var(--ink);
    color:var(--chalk);
    font-family:'Work Sans',sans-serif;
    min-height:100vh;
    -webkit-font-smoothing:antialiased;
  }
  h1,h2,h3,.display{font-family:'Oswald',sans-serif;text-transform:uppercase;letter-spacing:.03em;}
  .mono{font-family:'JetBrains Mono',monospace;}
  button{font-family:inherit;cursor:pointer;}
  input,select{font-family:inherit;}
  a{color:inherit;}
  ::selection{background:var(--gold);color:var(--ink);}
  :focus-visible{outline:2px solid var(--gold);outline-offset:2px;}

  /* ---------- layout shells ---------- */
  #app{min-height:100vh;width:100%;display:flex;flex-direction:column;}
  .topbar{
    display:flex;align-items:center;justify-content:space-between;
    padding:14px 24px;background:var(--ink-2);border-bottom:1px solid var(--line);
    position:sticky;top:0;z-index:20;
  }
  .brand{display:flex;align-items:center;gap:10px;}
  .brand .mark{
    width:30px;height:30px;border-radius:6px;background:var(--gold);
    display:flex;align-items:center;justify-content:center;
    font-family:'Oswald',sans-serif;font-weight:700;color:var(--ink);font-size:15px;
    transform:rotate(-4deg);
  }
  .brand .title{font-size:19px;font-weight:600;letter-spacing:.06em;}
  .topbar-right{display:flex;align-items:center;gap:14px;font-size:13px;color:var(--chalk-dim);}
  .btn{
    border:1px solid var(--line);background:transparent;color:var(--chalk);
    padding:9px 16px;border-radius:7px;font-size:13.5px;font-weight:500;
    transition:.15s ease;
  }
  .btn:hover{border-color:var(--gold);color:var(--gold);}
  .btn-primary{
    background:var(--gold);border-color:var(--gold);color:var(--ink);font-weight:600;
  }
  .btn-primary:hover{background:#f0c158;color:var(--ink);border-color:#f0c158;}
  .btn-danger{border-color:var(--clay-dim);color:#e79aa1;}
  .btn-danger:hover{border-color:var(--clay);color:#ffbfc5;}
  .btn-ghost{border-color:transparent;color:var(--chalk-dim);padding:6px 10px;}
  .btn-ghost:hover{color:var(--gold);}
  .btn-small{padding:6px 12px;font-size:12.5px;}
  .btn:disabled{opacity:.4;cursor:not-allowed;}

  main{flex:1;display:flex;flex-direction:column;}

  /* ---------- auth screen ---------- */
  .auth-wrap{
    flex:1;display:flex;align-items:center;justify-content:center;padding:32px 16px;
    background:
      repeating-linear-gradient(90deg, var(--pitch-mid) 0 80px, var(--pitch-light) 80px 160px),
      var(--pitch-deep);
    position:relative;
  }
  .auth-wrap::before{
    content:"";position:absolute;inset:0;
    background:radial-gradient(ellipse at 50% 0%, rgba(0,0,0,0) 0%, rgba(0,0,0,.55) 100%);
  }
  .auth-card{
    position:relative;z-index:1;
    width:100%;max-width:420px;background:var(--ink-2);
    border:1px solid var(--line);border-radius:14px;padding:36px 32px 30px;
    box-shadow:var(--shadow);
  }
  .auth-hero{text-align:center;margin-bottom:22px;}
  .auth-hero .mark-lg{
    width:56px;height:56px;border-radius:12px;background:var(--gold);margin:0 auto 14px;
    display:flex;align-items:center;justify-content:center;font-family:'Oswald',sans-serif;
    font-weight:700;color:var(--ink);font-size:26px;transform:rotate(-4deg);
  }
  .auth-hero h1{font-size:26px;margin:0 0 6px;}
  .auth-hero p{color:var(--chalk-dim);font-size:13.5px;margin:0;line-height:1.5;}
  .tabbar{display:flex;background:var(--ink);border-radius:8px;padding:4px;margin-bottom:20px;border:1px solid var(--line);}
  .tabbar button{
    flex:1;background:transparent;border:none;color:var(--chalk-dim);padding:9px 0;
    border-radius:6px;font-size:13.5px;font-weight:600;letter-spacing:.02em;
  }
  .tabbar button.active{background:var(--gold);color:var(--ink);}
  .field{margin-bottom:14px;}
  .field label{display:block;font-size:12px;color:var(--chalk-dim);margin-bottom:6px;text-transform:uppercase;letter-spacing:.05em;}
  .field input,.field select{
    width:100%;background:var(--ink);border:1px solid var(--line);color:var(--chalk);
    padding:10px 12px;border-radius:7px;font-size:14px;
  }
  .field input:focus,.field select:focus{border-color:var(--gold);}
  .form-msg{font-size:13px;color:var(--clay);min-height:18px;margin:-4px 0 10px;}
  .form-msg.ok{color:#7fd99a;}

  /* ---------- dashboard ---------- */
  .page{padding:32px 24px 60px;max-width:1100px;margin:0 auto;width:100%;}
  .page-head{display:flex;align-items:baseline;justify-content:space-between;flex-wrap:wrap;gap:10px;margin-bottom:22px;}
  .page-head h1{font-size:24px;margin:0;}
  .page-head p{color:var(--chalk-dim);font-size:13.5px;margin:4px 0 0;}
  .club-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(220px,1fr));gap:16px;}
  .club-card{
    background:var(--ink-2);border:1px solid var(--line);border-radius:12px;padding:20px;
    display:flex;flex-direction:column;gap:10px;cursor:pointer;transition:.15s ease;text-align:left;
  }
  .club-card:hover{border-color:var(--gold);transform:translateY(-2px);}
  .crest{
    width:46px;height:46px;border-radius:9px;display:flex;align-items:center;justify-content:center;
    font-family:'Oswald',sans-serif;font-weight:700;font-size:16px;color:#fff;
    box-shadow:inset 0 0 0 2px rgba(255,255,255,.18);
  }
  .club-card .name{font-family:'Oswald',sans-serif;font-size:17px;text-transform:uppercase;letter-spacing:.02em;}
  .club-card .meta{color:var(--chalk-dim);font-size:12.5px;}
  .club-card .count{
    margin-top:auto;font-size:12px;color:var(--gold);font-weight:600;
    display:flex;align-items:center;gap:6px;
  }
  .club-card.add{
    align-items:center;justify-content:center;border-style:dashed;color:var(--chalk-dim);
  }
  .club-card.add:hover{color:var(--gold);}
  .club-card.add .plus{font-size:30px;line-height:1;font-family:'Oswald',sans-serif;}

  .modal-backdrop{
    position:fixed;inset:0;background:rgba(5,10,7,.65);display:flex;align-items:center;justify-content:center;
    z-index:100;padding:16px;
  }
  .modal{
    background:var(--ink-2);border:1px solid var(--line);border-radius:14px;padding:28px;
    width:100%;max-width:440px;box-shadow:var(--shadow);
  }
  .modal h2{font-size:19px;margin:0 0 4px;}
  .modal .sub{color:var(--chalk-dim);font-size:12.5px;margin:0 0 18px;}
  .color-row{display:flex;gap:8px;flex-wrap:wrap;margin-top:6px;}
  .swatch{
    width:28px;height:28px;border-radius:7px;border:2px solid transparent;cursor:pointer;
  }
  .swatch.selected{border-color:var(--chalk);}
  .modal-actions{display:flex;justify-content:flex-end;gap:10px;margin-top:20px;}

  /* ---------- workspace ---------- */
  .club-strip{
    display:flex;align-items:center;gap:12px;padding:16px 24px;background:var(--ink-2);
    border-bottom:1px solid var(--line);
  }
  .club-strip .name{font-size:18px;}
  .club-strip .meta{color:var(--chalk-dim);font-size:12.5px;}
  .tabs{
    display:flex;gap:4px;padding:0 24px;background:var(--ink-2);border-bottom:1px solid var(--line);
    overflow-x:auto;
  }
  .tabs button{
    background:transparent;border:none;color:var(--chalk-dim);padding:12px 16px;font-size:13.5px;
    font-weight:600;letter-spacing:.02em;border-bottom:2px solid transparent;white-space:nowrap;
  }
  .tabs button.active{color:var(--gold);border-color:var(--gold);}

  .workarea{padding:26px 24px 60px;max-width:1180px;margin:0 auto;width:100%;}

  /* --- kader tab --- */
  .kader-layout{display:grid;grid-template-columns:300px 1fr;gap:22px;align-items:start;}
  @media (max-width:760px){.kader-layout{grid-template-columns:1fr;}}
  .card{background:var(--ink-2);border:1px solid var(--line);border-radius:12px;padding:20px;}
  .card h3{font-size:15px;margin:0 0 14px;color:var(--chalk);}
  .player-table{width:100%;border-collapse:collapse;}
  .player-table th{
    text-align:left;font-size:11px;color:var(--chalk-dim);text-transform:uppercase;letter-spacing:.06em;
    padding:0 10px 10px;border-bottom:1px solid var(--line);font-weight:600;
  }
  .player-table td{padding:11px 10px;border-bottom:1px solid var(--line);font-size:14px;vertical-align:middle;}
  .player-table tr:last-child td{border-bottom:none;}
  .num-badge{
    display:inline-flex;align-items:center;justify-content:center;width:30px;height:30px;
    border-radius:7px;background:var(--pitch-mid);color:var(--chalk);font-family:'JetBrains Mono',monospace;
    font-weight:700;font-size:13px;
  }
  .pos-badge{
    display:inline-block;padding:3px 8px;border-radius:5px;background:var(--ink);border:1px solid var(--line);
    font-family:'JetBrains Mono',monospace;font-size:11.5px;color:var(--gold);letter-spacing:.03em;
  }
  .empty-note{color:var(--chalk-dim);font-size:13.5px;padding:18px 4px;text-align:center;}

  /* --- aufstellung tab --- */
  .formation-toolbar{display:flex;align-items:center;gap:14px;margin-bottom:18px;flex-wrap:wrap;}
  .formation-toolbar .field{margin:0;min-width:180px;}
  .pitch-layout{display:grid;grid-template-columns:1fr 250px;gap:22px;align-items:start;}
  @media (max-width:820px){.pitch-layout{grid-template-columns:1fr;}}
  .pitch-wrap{
    position:relative;width:100%;aspect-ratio:68/100;border-radius:14px;overflow:hidden;
    border:2px solid rgba(255,255,255,.14);
    background:
      repeating-linear-gradient(0deg, var(--pitch-mid) 0 9%, var(--pitch-light) 9% 18%);
    box-shadow:var(--shadow);
  }
  .pitch-svg{position:absolute;inset:0;width:100%;height:100%;}
  .slot{
    position:absolute;transform:translate(-50%,-50%);display:flex;flex-direction:column;align-items:center;gap:3px;
    cursor:pointer;user-select:none;width:70px;
  }
  .slot .token{
    width:42px;height:42px;border-radius:50%;background:var(--ink-2);border:2px dashed var(--chalk-dim);
    display:flex;align-items:center;justify-content:center;font-family:'JetBrains Mono',monospace;
    font-weight:700;font-size:14px;color:var(--chalk-dim);transition:.12s ease;
  }
  .slot.filled .token{
    border-style:solid;border-color:var(--gold);background:var(--gold);color:var(--ink);
  }
  .slot:hover .token{border-color:var(--gold);}
  .slot.active .token{box-shadow:0 0 0 4px rgba(227,178,60,.35);}
  .slot .slot-label{
    font-size:10.5px;color:rgba(238,243,234,.85);background:rgba(12,23,18,.55);padding:1px 6px;
    border-radius:4px;font-family:'JetBrains Mono',monospace;letter-spacing:.03em;
  }
  .slot .slot-name{
    font-size:10.5px;color:#fff;max-width:70px;text-align:center;line-height:1.2;
    text-shadow:0 1px 3px rgba(0,0,0,.8);
  }
  .side-panel .card{margin-bottom:14px;}
  .bench-list{display:flex;flex-direction:column;gap:8px;max-height:340px;overflow:auto;}
  .bench-chip{
    display:flex;align-items:center;gap:8px;padding:8px 10px;border-radius:8px;background:var(--ink);
    border:1px solid var(--line);font-size:13px;cursor:grab;
  }
  .bench-chip:hover{border-color:var(--gold);}
  .picker-panel{border:1px solid var(--gold);}
  .picker-list{display:flex;flex-direction:column;gap:6px;max-height:260px;overflow:auto;}
  .picker-item{
    display:flex;align-items:center;justify-content:space-between;gap:8px;padding:8px 10px;
    border-radius:7px;background:var(--ink);border:1px solid var(--line);font-size:13px;
  }
  .picker-item button{background:transparent;border:none;color:var(--gold);font-size:12.5px;font-weight:600;}
  .picker-item button:hover{text-decoration:underline;}
  .picker-empty{color:var(--chalk-dim);font-size:12.5px;padding:6px 2px;}

  form.inline{display:flex;flex-direction:column;gap:12px;}
  .row-2{display:grid;grid-template-columns:1fr 1fr;gap:10px;}
  .del-x{background:transparent;border:none;color:var(--chalk-dim);font-size:16px;padding:2px 6px;border-radius:5px;}
  .del-x:hover{color:var(--clay);}
  .hint{color:var(--chalk-dim);font-size:12px;line-height:1.5;margin-top:4px;}
  .kv{display:flex;justify-content:space-between;font-size:13px;padding:6px 0;border-bottom:1px solid var(--line);}
  .kv:last-child{border-bottom:none;}
  .kv span:first-child{color:var(--chalk-dim);}
  .storage-note{
    font-size:11.5px;color:var(--chalk-dim);text-align:center;padding:8px 16px;background:var(--ink-2);
    border-top:1px solid var(--line);
  }
  .toast{
    position:fixed;bottom:20px;left:50%;transform:translateX(-50%);background:var(--ink-2);
    border:1px solid var(--gold);color:var(--chalk);padding:10px 18px;border-radius:8px;font-size:13px;
    box-shadow:var(--shadow);z-index:200;opacity:0;pointer-events:none;transition:opacity .2s ease;
  }
  .toast.show{opacity:1;}
</style>
</head>
<body>
<div id="app"></div>
<div class="toast" id="toast"></div>

<script>
(function(){
  "use strict";

  /* ============ Fachdaten ============ */
  var POSITIONS = {
    TW:"Torwart", IV:"Innenverteidiger", LV:"Linksverteidiger", RV:"Rechtsverteidiger",
    DM:"Defensives Mittelfeld", ZM:"Zentrales Mittelfeld", OM:"Offensives Mittelfeld",
    LM:"Linkes Mittelfeld", RM:"Rechtes Mittelfeld", LA:"Linksaußen", RA:"Rechtsaußen", MS:"Mittelstürmer"
  };
  var CLUB_COLORS = ["#b8434f","#e3b23c","#2f6f4e","#3f6fa8","#7a4fb0","#c46a2e","#2c9aa3","#8a8f98"];

  var TROPHY_DEFS = [
    { titel:"Erste Schritte", desc:"Einen Vereinsmanager-Account erstellt.", type:"auto" },
    { titel:"Vereinsgründer", desc:"Den ersten Verein gegründet.", type:"auto" },
    { titel:"Komplette Elf", desc:"11 Profispieler mit bestätigtem Account hinzugefügt.", type:"future", note:"Benötigt Account-Bestätigung – spätere Funktion." },
    { titel:"Taktik-Fuchs", desc:"Zum ersten Mal eine Formation geändert.", type:"tracked", key:"formationChanged" },
    { titel:"Erster Sieg", desc:"Das erste Spiel gewonnen.", type:"future", note:"Spielbetrieb ist eine spätere Funktion." },
    { titel:"Fan-Magnet", desc:"11.000 Fans erreicht.", type:"future", note:"Fan-Zähler ist eine spätere Funktion." },
    { titel:"Kommt bald", desc:"Diese Trophäe wird noch bekannt gegeben.", type:"future" },
    { titel:"Kommt bald", desc:"Diese Trophäe wird noch bekannt gegeben.", type:"future" },
    { titel:"Kommt bald", desc:"Diese Trophäe wird noch bekannt gegeben.", type:"future" }
  ];
  function trophyUnlocked(club, def){
    if(def.type === "auto") return true;
    if(def.type === "tracked") return !!(club.achievements && club.achievements[def.key]);
    return false;
  }

  var VEREINSERFOLG_DEFS = [
    { id:"meisterschaft",       titel:"Meisterschaft",       icon:"🏆", desc:"Die Liga als Meister abgeschlossen." },
    { id:"aufstieg",            titel:"Aufstieg",            icon:"📈", desc:"Aufstieg in eine höhere Liga geschafft." },
    { id:"pokalsieg",           titel:"Pokalsieg",           icon:"🥇", desc:"Einen Pokalwettbewerb gewonnen." },
    { id:"klassenerhalt",       titel:"Klassenerhalt",       icon:"🛡️", desc:"Den Klassenerhalt gesichert." },
    { id:"hallenmeisterschaft", titel:"Hallenmeisterschaft", icon:"🏟️", desc:"Eine Hallenmeisterschaft gewonnen." },
    { id:"fairplay",            titel:"Fair-Play-Preis",     icon:"🤝", desc:"Den Fair-Play-Preis der Liga erhalten." },
    { id:"publikumspreis",      titel:"Publikumspreis",      icon:"📣", desc:"Auszeichnung für besten Zuschauerzuspruch." },
    { id:"turniersieg",         titel:"Turniersieg",         icon:"🎖️", desc:"Ein Freundschafts- oder Hallenturnier gewonnen." },
    { id:"jubilaeum",           titel:"Vereinsjubiläum",     icon:"🎉", desc:"Ein rundes Vereinsjubiläum gefeiert." }
  ];

  var FORMATIONS = {
    "4-4-2":[
      {id:"gk",label:"TW",x:50,y:92},
      {id:"lv",label:"LV",x:12,y:74},{id:"iv1",label:"IV",x:36,y:78},{id:"iv2",label:"IV",x:64,y:78},{id:"rv",label:"RV",x:88,y:74},
      {id:"lm",label:"LM",x:12,y:48},{id:"zm1",label:"ZM",x:36,y:52},{id:"zm2",label:"ZM",x:64,y:52},{id:"rm",label:"RM",x:88,y:48},
      {id:"st1",label:"MS",x:36,y:20},{id:"st2",label:"MS",x:64,y:20}
    ],
    "4-3-3":[
      {id:"gk",label:"TW",x:50,y:92},
      {id:"lv",label:"LV",x:12,y:74},{id:"iv1",label:"IV",x:36,y:78},{id:"iv2",label:"IV",x:64,y:78},{id:"rv",label:"RV",x:88,y:74},
      {id:"zm1",label:"ZM",x:28,y:52},{id:"zm2",label:"ZM",x:50,y:56},{id:"zm3",label:"ZM",x:72,y:52},
      {id:"la",label:"LA",x:14,y:20},{id:"ms",label:"MS",x:50,y:15},{id:"ra",label:"RA",x:86,y:20}
    ],
    "3-5-2":[
      {id:"gk",label:"TW",x:50,y:92},
      {id:"iv1",label:"IV",x:26,y:78},{id:"iv2",label:"IV",x:50,y:80},{id:"iv3",label:"IV",x:74,y:78},
      {id:"lm",label:"LM",x:8,y:50},{id:"zm1",label:"ZM",x:32,y:55},{id:"dm",label:"DM",x:50,y:60},{id:"zm2",label:"ZM",x:68,y:55},{id:"rm",label:"RM",x:92,y:50},
      {id:"st1",label:"MS",x:38,y:20},{id:"st2",label:"MS",x:62,y:20}
    ],
    "4-2-3-1":[
      {id:"gk",label:"TW",x:50,y:92},
      {id:"lv",label:"LV",x:12,y:78},{id:"iv1",label:"IV",x:36,y:80},{id:"iv2",label:"IV",x:64,y:80},{id:"rv",label:"RV",x:88,y:78},
      {id:"dm1",label:"DM",x:36,y:60},{id:"dm2",label:"DM",x:64,y:60},
      {id:"lm",label:"LM",x:14,y:36},{id:"om",label:"OM",x:50,y:33},{id:"rm",label:"RM",x:86,y:36},
      {id:"st",label:"MS",x:50,y:14}
    ],
    "5-3-2":[
      {id:"gk",label:"TW",x:50,y:92},
      {id:"lv",label:"LV",x:8,y:70},{id:"iv1",label:"IV",x:30,y:78},{id:"iv2",label:"IV",x:50,y:80},{id:"iv3",label:"IV",x:70,y:78},{id:"rv",label:"RV",x:92,y:70},
      {id:"zm1",label:"ZM",x:30,y:50},{id:"zm2",label:"ZM",x:50,y:53},{id:"zm3",label:"ZM",x:70,y:50},
      {id:"st1",label:"MS",x:38,y:20},{id:"st2",label:"MS",x:62,y:20}
    ]
  };

  /* ============ Speicher ============ */
  var hasWindowStorage = typeof window.storage !== "undefined" && window.storage;
  var hasLocalStorage = (function(){
    try {
      var k = "__km_test__";
      localStorage.setItem(k, "1");
      localStorage.removeItem(k);
      return true;
    } catch(e){ return false; }
  })();
  var memoryFallback = { value: null };
  var STORE_KEY = "kadermeister-data";

  function uid(){ return Math.random().toString(36).slice(2,10) + Date.now().toString(36).slice(-4); }

  function defaultState(){
    return { vms: [], clubs: [] };
  }

  var state = defaultState();
  var session = { vmId:null, clubId:null, tab:"kader", activeSlot:null, vereinserfolgeView:null, infoView:null };

  function persist(){
    var json = JSON.stringify(state);
    if(hasWindowStorage){
      window.storage.set(STORE_KEY, json, false).catch(function(){ showToast("Speichern fehlgeschlagen."); });
    } else if(hasLocalStorage){
      try { localStorage.setItem(STORE_KEY, json); } catch(e){ showToast("Speichern fehlgeschlagen."); }
    } else {
      memoryFallback.value = json;
    }
  }

  function loadState(cb){
    if(hasWindowStorage){
      window.storage.get(STORE_KEY, false).then(function(res){
        if(res && res.value){
          try { state = JSON.parse(res.value); } catch(e){ state = defaultState(); }
        }
        cb();
      }).catch(function(){ cb(); });
    } else if(hasLocalStorage){
      try {
        var raw = localStorage.getItem(STORE_KEY);
        if(raw){ try { state = JSON.parse(raw); } catch(e){ state = defaultState(); } }
      } catch(e){}
      cb();
    } else {
      if(memoryFallback.value){
        try { state = JSON.parse(memoryFallback.value); } catch(e){ state = defaultState(); }
      }
      cb();
    }
  }

  function showToast(msg){
    var t = document.getElementById("toast");
    t.textContent = msg;
    t.classList.add("show");
    clearTimeout(showToast._h);
    showToast._h = setTimeout(function(){ t.classList.remove("show"); }, 2200);
  }

  /* ============ Helpers ============ */
  function currentVm(){ return state.vms.find(function(v){ return v.id===session.vmId; }); }
  function currentClub(){ return state.clubs.find(function(c){ return c.id===session.clubId; }); }
  function vmClubs(vmId){ return state.clubs.filter(function(c){ return c.vmId===vmId; }); }
  function esc(s){ var d=document.createElement("div"); d.textContent = s==null?"":String(s); return d.innerHTML; }
  function crestInner(club){
    if(club.logo){
      return '<img src="' + club.logo + '" alt="" style="width:100%;height:100%;object-fit:cover;border-radius:inherit;">';
    }
    return esc(club.kuerzel);
  }

  /* ============ Render root ============ */
  var root = document.getElementById("app");

  function render(){
    root.innerHTML = "";
    if(!session.vmId){
      root.appendChild(renderAuth());
    } else if(!session.clubId){
      root.appendChild(renderTopbar());
      root.appendChild(renderDashboard());
      root.appendChild(renderStorageNote());
    } else {
      root.appendChild(renderTopbar());
      root.appendChild(renderClubStrip());
      root.appendChild(renderTabs());
      var work = document.createElement("main");
      work.appendChild(renderWorkarea());
      root.appendChild(work);
      root.appendChild(renderStorageNote());
    }
  }

  function renderStorageNote(){
    var div = document.createElement("div");
    div.className = "storage-note";
    div.textContent = (hasWindowStorage || hasLocalStorage)
      ? "Daten werden automatisch in diesem Browser gespeichert und bleiben auch nach dem Schließen erhalten."
      : "Hinweis: Diese Sitzung läuft ohne dauerhaften Speicher – Daten gehen beim Neuladen der Seite verloren.";
    return div;
  }

  /* ============ Topbar ============ */

    bar.className = "topbar";

    bar.innerHTML =
      '<div class="brand"><div class="mark">KM</div><div class="title">Kadermeister</div></div>' +

        (session.clubId ? '<button class="btn btn-small" id="btnSwitchClub">Vereine wechseln</button>' : '') +

        '<button class="btn btn-small" id="btnImport" title="Zuvor gesicherte Datei wieder laden">⬆ Laden</button>' +
        '<span>Angemeldet als <strong>' + esc(vm ? vm.name : "") + '</strong></span>' +
        '<button class="btn btn-small" id="btnLogout">Abmelden</button>' +

    });

    bar.querySelector("#btnExport").addEventListener("click", exportData);

  function loginForm(){
    var f = document.createElement("form");
    f.className = "inline";

      var msg = f.querySelector("#loginMsg");
      var vm = state.vms.find(function(v){ return v.username.toLowerCase()===user.toLowerCase(); });

          '</div>' +
        '</form>' +
      '</div>';

    var colorRow = backdrop.querySelector("#colorRow");
    CLUB_COLORS.forEach(function(col, i){
      var sw = document.createElement("div");
      sw.className = "swatch" + (i===0 ? " selected" : "");
      sw.style.background = col;
      sw.addEventListener("click", function(){
        selectedColor = col;

      });

    backdrop.querySelector("#cancelClub").addEventListener("click", function(){ backdrop.remove(); });
    backdrop.addEventListener("click", function(e){ if(e.target===backdrop) backdrop.remove(); });

    backdrop.querySelector("#clubForm").addEventListener("submit", function(e){
      e.preventDefault();
      var name = backdrop.querySelector("#cName").value.trim();
      var ort = backdrop.querySelector("#cOrt").value.trim();
      var jahr = backdrop.querySelector("#cJahr").value.trim();
      var kuerzel = backdrop.querySelector("#cKuerzel").value.trim().toUpperCase() || name.slice(0,3).toUpperCase();

      var club = {
        id: uid(), vmId: session.vmId, name: name, ort: ort, jahr: jahr,
        farbe: selectedColor, kuerzel: kuerzel, players: [],
        manager: currentVm() ? currentVm().name : "",
        erfolge: {}, ziele: [], todos: [],

      };

      showToast("Verein „" + name + "“ gegründet!");

  function renderTabs(){

    var wrap = document.createElement("div");

    else if(session.tab==="you") wrap.appendChild(renderYou());

    else if(session.tab==="ziele") wrap.appendChild(renderSaisonTab());
    else wrap.appendChild(renderInfoTab());

  /* ============ Kader tab ============ */
  function renderKader(){
    var club = currentClub();
    var wrap = document.createElement("div");
    wrap.className = "kader-layout";

    var formCard = document.createElement("div");
    formCard.className = "card";
    formCard.innerHTML = '<h3>Spieler hinzufügen</h3>';
    var form = document.createElement("form");
    form.className = "inline";
    var options = Object.keys(POSITIONS).map(function(k){ return '<option value="'+k+'">'+k+' – '+POSITIONS[k]+'</option>'; }).join("");
    form.innerHTML =
      '<div class="field"><label>Name</label><input type="text" id="pName" placeholder="Vor- und Nachname" required></div>' +
      '<div class="row-2">' +
        '<div class="field"><label>Rückennummer</label><input type="number" id="pNum" min="1" max="99" placeholder="z. B. 9"></div>' +
        '<div class="field"><label>Position</label><select id="pPos">' + options + '</select></div>' +
      '</div>' +
      '<div class="form-msg" id="pMsg"></div>' +
      '<button type="submit" class="btn btn-primary">Zum Kader hinzufügen</button>';
    formCard.appendChild(form);

    form.addEventListener("submit", function(e){
      e.preventDefault();
      var name = form.querySelector("#pName").value.trim();
      var num = form.querySelector("#pNum").value;
      var pos = form.querySelector("#pPos").value;
      var msg = form.querySelector("#pMsg");
      if(!name){ msg.textContent = "Bitte einen Namen angeben."; return; }
      club.players.push({ id: uid(), name: name, nummer: num ? Number(num) : null, position: pos });
      persist();
      form.reset();
      render();
      showToast(name + " wurde zum Kader hinzugefügt.");
    });

    var listCard = document.createElement("div");
    listCard.className = "card";
    listCard.innerHTML = '<h3>Kader (' + club.players.length + ')</h3>';

    if(club.players.length===0){
      var empty = document.createElement("div");
      empty.className = "empty-note";
      empty.textContent = "Noch keine Spieler im Kader. Füge links den ersten Spieler hinzu.";
      listCard.appendChild(empty);
    } else {
      var table = document.createElement("table");
      table.className = "player-table";
      table.innerHTML =
        '<thead><tr><th>#</th><th>Name</th><th>Position</th><th></th></tr></thead><tbody></tbody>';
      var tbody = table.querySelector("tbody");
      club.players.slice().sort(function(a,b){ return (a.nummer||99)-(b.nummer||99); }).forEach(function(p){
        var tr = document.createElement("tr");
        tr.innerHTML =
          '<td><span class="num-badge">' + (p.nummer!=null ? p.nummer : "–") + '</span></td>' +
          '<td>' + esc(p.name) + '</td>' +
          '<td><span class="pos-badge">' + p.position + '</span> <span style="color:var(--chalk-dim);font-size:12px;">' + POSITIONS[p.position] + '</span></td>' +
          '<td style="text-align:right;"><button class="del-x" title="Spieler entfernen">✕</button></td>';
        tr.querySelector(".del-x").addEventListener("click", function(){
          club.players = club.players.filter(function(pl){ return pl.id!==p.id; });
          Object.keys(club.formation.slots).forEach(function(slotId){
            if(club.formation.slots[slotId]===p.id) delete club.formation.slots[slotId];
          });
          persist();
          render();
          showToast(p.name + " wurde entfernt.");
        });
        tbody.appendChild(tr);
      });
      listCard.appendChild(table);
    }

    wrap.appendChild(formCard);
    wrap.appendChild(listCard);
    return wrap;
  }

  /* ============ Aufstellung tab ============ */
  function renderAufstellung(){
    var club = currentClub();
    var wrap = document.createElement("div");

    var toolbar = document.createElement("div");
    toolbar.className = "formation-toolbar";
    var opts = Object.keys(FORMATIONS).map(function(k){
      return '<option value="'+k+'"' + (club.formation.template===k?" selected":"") + '>' + k + '</option>';
    }).join("");
    toolbar.innerHTML =
      '<div class="field"><label>Formation</label><select id="formationSelect">' + opts + '</select></div>' +
      '<div class="hint" style="margin-top:18px;">Klicke einen Platz auf dem Feld an, um einen Spieler zuzuweisen.</div>';
    toolbar.querySelector("#formationSelect").addEventListener("change", function(e){
      club.formation.template = e.target.value;
      club.formation.slots = {};
      session.activeSlot = null;
      club.achievements = club.achievements || {};
      club.achievements.formationChanged = true;
      persist();
      render();
    });

    var layout = document.createElement("div");
    layout.className = "pitch-layout";

    var pitchWrap = document.createElement("div");
    pitchWrap.className = "pitch-wrap";
    pitchWrap.appendChild(pitchMarkingsSvg());

    var slots = FORMATIONS[club.formation.template];
    slots.forEach(function(slot){
      var playerId = club.formation.slots[slot.id];
      var player = playerId ? club.players.find(function(p){ return p.id===playerId; }) : null;
      var el = document.createElement("div");
      el.className = "slot" + (player ? " filled" : "") + (session.activeSlot===slot.id ? " active" : "");
      el.style.left = slot.x + "%";
      el.style.top = slot.y + "%";
      el.innerHTML =
        '<div class="token">' + (player ? (player.nummer!=null?player.nummer:"•") : slot.label) + '</div>' +
        '<div class="slot-label">' + slot.label + '</div>' +
        (player ? '<div class="slot-name">' + esc(player.name.split(" ").pop()) + '</div>' : '');
      el.addEventListener("click", function(){
        session.activeSlot = session.activeSlot===slot.id ? null : slot.id;
        render();
      });
      pitchWrap.appendChild(el);
    });

    layout.appendChild(pitchWrap);

    var sidePanel = document.createElement("div");
    sidePanel.className = "side-panel";

    if(session.activeSlot){
      var activeDef = slots.find(function(s){ return s.id===session.activeSlot; });
      var pickerCard = document.createElement("div");
      pickerCard.className = "card picker-panel";
      pickerCard.innerHTML = '<h3>Platz „' + activeDef.label + '“ besetzen</h3>';
      var assignedId = club.formation.slots[session.activeSlot];

      var pickList = document.createElement("div");
      pickList.className = "picker-list";
      var assignedElsewhere = Object.values(club.formation.slots);
      var available = club.players.filter(function(p){ return !assignedElsewhere.includes(p.id) || p.id===assignedId; });

      if(available.length===0){
        pickList.innerHTML = '<div class="picker-empty">Alle Spieler sind bereits aufgestellt oder der Kader ist leer.</div>';
      } else {
        available
          .slice()
          .sort(function(a,b){ return (a.position===activeDef.label?-1:0) - (b.position===activeDef.label?-1:0); })
          .forEach(function(p){
          var item = document.createElement("div");
          item.className = "picker-item";
          var match = p.position===activeDef.label ? ' <span style="color:var(--gold);">·passt·</span>' : "";
          item.innerHTML =
            '<span>' + (p.nummer!=null?('#'+p.nummer+' '):'') + esc(p.name) + ' <span class="pos-badge" style="margin-left:4px;">' + p.position + '</span>' + match + '</span>';
          var btn = document.createElement("button");
          btn.textContent = p.id===assignedId ? "Zugewiesen" : "Zuweisen";
          btn.disabled = p.id===assignedId;
          btn.addEventListener("click", function(){
            club.formation.slots[session.activeSlot] = p.id;
            club.achievements = club.achievements || {};
            club.achievements.formationChanged = true;
            persist();
            render();
          });
          item.appendChild(btn);
          pickList.appendChild(item);
        });
      }
      pickerCard.appendChild(pickList);

      if(assignedId){
        var removeBtn = document.createElement("button");
        removeBtn.className = "btn btn-danger btn-small";
        removeBtn.style.marginTop = "12px";
        removeBtn.textContent = "Platz freimachen";
        removeBtn.addEventListener("click", function(){
          delete club.formation.slots[session.activeSlot];
          persist();
          render();
        });
        pickerCard.appendChild(removeBtn);
      }
      sidePanel.appendChild(pickerCard);
    }

    var benchIds = Object.values(club.formation.slots);
    var bench = club.players.filter(function(p){ return !benchIds.includes(p.id); });
    var benchCard = document.createElement("div");
    benchCard.className = "card";
    benchCard.innerHTML = '<h3>Bank (' + bench.length + ')</h3>';
    if(bench.length===0){
      benchCard.innerHTML += '<div class="picker-empty">Alle Spieler sind aufgestellt.</div>';
    } else {
      var benchList = document.createElement("div");
      benchList.className = "bench-list";
      bench.forEach(function(p){
        var chip = document.createElement("div");
        chip.className = "bench-chip";
        chip.innerHTML = '<span class="pos-badge">' + p.position + '</span> ' + (p.nummer!=null?('#'+p.nummer+' '):'') + esc(p.name);
        benchCard.querySelector; // noop
        benchList.appendChild(chip);
      });
      benchCard.appendChild(benchList);
    }
    sidePanel.appendChild(benchCard);

    layout.appendChild(sidePanel);

    wrap.appendChild(toolbar);
    wrap.appendChild(layout);
    return wrap;
  }

  function pitchMarkingsSvg(){
    var svgNS = "http://www.w3.org/2000/svg";
    var svg = document.createElementNS(svgNS, "svg");
    svg.setAttribute("class", "pitch-svg");
    svg.setAttribute("viewBox", "0 0 100 100");
    svg.setAttribute("preserveAspectRatio", "none");
    var stroke = "rgba(255,255,255,.55)";
    var lines = [
      '<rect x="2" y="2" width="96" height="96" fill="none" stroke="'+stroke+'" stroke-width="0.4" vector-effect="non-scaling-stroke"/>',
      '<line x1="2" y1="50" x2="98" y2="50" stroke="'+stroke+'" stroke-width="0.4"/>',
      '<circle cx="50" cy="50" r="9" fill="none" stroke="'+stroke+'" stroke-width="0.4"/>',
      '<circle cx="50" cy="50" r="0.6" fill="'+stroke+'"/>',
      '<rect x="20" y="2" width="60" height="14" fill="none" stroke="'+stroke+'" stroke-width="0.4"/>',

  function buildChecklistSection(club, key, flagKey, cfg){
    var items = club[key] = club[key] || [];
    var inputId = key + "Text";
    var section = document.createElement("div");
    section.className = "kader-layout";

    var formCard = document.createElement("div");
    formCard.className = "card";
    formCard.innerHTML = '<h3>' + cfg.formTitle + '</h3>';
    var form = document.createElement("form");
    form.className = "inline";
    form.innerHTML =
      '<div class="field"><label>' + cfg.fieldLabel + '</label><input type="text" id="' + inputId + '" placeholder="' + cfg.placeholder + '" required></div>' +
      '<div class="form-msg" id="' + key + 'Msg"></div>' +
      '<button type="submit" class="btn btn-primary">' + cfg.addBtnLabel + '</button>';
    formCard.appendChild(form);

    form.addEventListener("submit", function(e){
      e.preventDefault();
      var text = form.querySelector("#" + inputId).value.trim();
      var msg = form.querySelector("#" + key + "Msg");
      if(!text){ msg.textContent = cfg.emptyErr; return; }
      var item = { id: uid(), text: text };
      item[flagKey] = false;
      items.push(item);
      persist();
      render();
      showToast(cfg.addToast);
    });

    var listCard = document.createElement("div");
    listCard.className = "card";
    listCard.innerHTML = '<h3>' + cfg.listTitle + ' (' + items.length + ')</h3>';
    if(items.length===0){
      var empty = document.createElement("div");
      empty.className = "empty-note";
      empty.textContent = cfg.emptyText;
      listCard.appendChild(empty);
    } else {
      var list = document.createElement("div");
      list.className = "bench-list";
      items.forEach(function(it){
        var done = !!it[flagKey];
        var chip = document.createElement("div");
        chip.className = "bench-chip";
        chip.style.cursor = "default";
        chip.style.justifyContent = "space-between";
        var label = document.createElement("span");
        label.textContent = (done ? cfg.doneEmoji : cfg.openEmoji) + " " + it.text;
        if(done){ label.style.textDecoration = "line-through"; label.style.color = "var(--chalk-dim)"; }
        var actions = document.createElement("div");
        actions.style.display = "flex";
        actions.style.gap = "6px";
        var toggleBtn = document.createElement("button");
        toggleBtn.className = "btn btn-small" + (done ? "" : " btn-primary");
        toggleBtn.textContent = done ? cfg.undoLabel : cfg.doneLabel;
        toggleBtn.addEventListener("click", function(){
          it[flagKey] = !it[flagKey];
          persist();
          render();
        });
        var delBtn = document.createElement("button");
        delBtn.className = "del-x";
        delBtn.title = cfg.deleteTitle;
        delBtn.textContent = "✕";
        delBtn.addEventListener("click", function(){
          club[key] = club[key].filter(function(x){ return x.id!==it.id; });
          persist();
          render();
          showToast(cfg.deleteToast);
        });
        actions.appendChild(toggleBtn);
        actions.appendChild(delBtn);
        chip.appendChild(label);
        chip.appendChild(actions);
        list.appendChild(chip);
      });
      listCard.appendChild(list);
    }

    section.appendChild(formCard);
    section.appendChild(listCard);
    return section;
  }

  /* ============ PIFA-eSports-Verknüpfung (optional, App-Level-Fortschritt) ============ */
  function xpForLevel(level){ return Math.round(100 * Math.pow(1.8, level)); }
  function computeLevelFromXP(totalXp){
    var level = 0, rem = totalXp || 0;
    while(level < 10){
      var needed = xpForLevel(level);
      if(rem < needed) break;
      rem -= needed;
      level++;
    }
    return { level: level, xpInLevel: rem, xpNeeded: level < 10 ? xpForLevel(level) : null };
  }
  function levelBarHtml(xp){
    var lv = computeLevelFromXP(xp);
    var pct = lv.xpNeeded ? Math.round((lv.xpInLevel / lv.xpNeeded) * 100) : 100;
    return (
      '<div style="display:flex;align-items:center;justify-content:space-between;margin-bottom:4px;">' +
        '<span style="font-size:11px;color:var(--chalk-dim);">Level</span>' +
        '<span class="mono" style="font-size:12px;color:var(--gold);font-weight:700;">' + lv.level + (lv.level>=10?" · MAX":"") + '</span>' +
      '</div>' +
      '<div style="height:6px;border-radius:4px;background:var(--ink-2);overflow:hidden;">' +
        '<div style="height:100%;width:' + pct + '%;background:var(--gold);"></div>' +
      '</div>' +
      '<div style="font-size:10.5px;color:var(--chalk-dim);margin-top:3px;">' +
        (lv.xpNeeded ? (lv.xpInLevel + ' / ' + lv.xpNeeded + ' XP') : (xp + ' XP')) +
      '</div>'
    );
  }

    var logoMsg = form.querySelector("#logoMsg");
    var logoRemoveBtn = form.querySelector("#eLogoRemove");
    var ALLOWED_LOGO_TYPES = ["image/png","image/jpeg","image/webp","image/svg+xml"];
    var MAX_LOGO_BYTES = 2 * 1024 * 1024;

    CLUB_COLORS.forEach(function(col){
      var sw = document.createElement("div");
      sw.className = "swatch" + (col===club.farbe ? " selected" : "");
      sw.style.background = col;
      sw.addEventListener("click", function(){
        selColor = col;
        colorRow.querySelectorAll(".swatch").forEach(function(s){ s.classList.remove("selected"); });
        sw.classList.add("selected");
        if(!selLogo) logoPreview.style.background = col;
      });
      colorRow.appendChild(sw);
    });

    logoFileInput.addEventListener("change", function(){
      var file = logoFileInput.files && logoFileInput.files[0];
      logoMsg.textContent = "";
      if(!file) return;
      if(file.type === "image/gif"){
        logoMsg.textContent = "Animierte GIFs werden aktuell nicht unterstützt.";
        logoFileInput.value = "";
        return;
      }
      if(ALLOWED_LOGO_TYPES.indexOf(file.type) === -1){
        logoMsg.textContent = "Bitte ein PNG-, JPG-, WEBP- oder SVG-Bild wählen.";
        logoFileInput.value = "";
        return;
      }
      if(file.size > MAX_LOGO_BYTES){
        logoMsg.textContent = "Die Datei ist zu groß (max. 2 MB).";
        logoFileInput.value = "";
        return;
      }
      var reader = new FileReader();
      reader.onload = function(e){
        selLogo = e.target.result;
        logoPreview.style.background = "transparent";
        logoPreview.innerHTML = '<img src="' + selLogo + '" alt="" style="width:100%;height:100%;object-fit:cover;border-radius:inherit;">';
        logoRemoveBtn.style.display = "";
      };
      reader.readAsDataURL(file);
    });

    logoRemoveBtn.addEventListener("click", function(){
      selLogo = null;
      logoFileInput.value = "";
      logoPreview.style.background = selColor;
      logoPreview.innerHTML = esc(club.kuerzel);
      logoRemoveBtn.style.display = "none";
    });

    form.addEventListener("submit", function(e){
      e.preventDefault();
      club.name = form.querySelector("#eName").value.trim() || club.name;
      club.manager = form.querySelector("#eManager").value.trim();
      club.ort = form.querySelector("#eOrt").value.trim();
      club.jahr = form.querySelector("#eJahr").value.trim();
      club.kuerzel = (form.querySelector("#eKuerzel").value.trim() || club.kuerzel).toUpperCase();
      club.farbe = selColor;
      club.logo = selLogo;
      persist();
      render();
      showToast("Vereinsdaten aktualisiert.");
    });

    var dangerCard = document.createElement("div");
    dangerCard.className = "card";
    dangerCard.innerHTML =
      '<h3>Überblick</h3>' +
      '<div class="kv"><span>Aktueller Vereinsmanager</span><span>' + esc(club.manager || "–") + '</span></div>' +
      '<div class="kv"><span>Spieler im Kader</span><span>' + club.players.length + '</span></div>' +
      '<div class="kv"><span>Vereinserfolge</span><span>' + Object.keys(club.erfolge||{}).length + ' / ' + VEREINSERFOLG_DEFS.length + '</span></div>' +
      '<div class="kv"><span>Offene Aufgaben</span><span>' + (club.todos||[]).filter(function(t){ return !t.done; }).length + ' / ' + (club.todos||[]).length + '</span></div>' +
      '<div class="kv"><span>Offene Ziele</span><span>' + (club.ziele||[]).filter(function(z){ return !z.erreicht; }).length + ' / ' + (club.ziele||[]).length + '</span></div>' +
      '<div class="kv"><span>Aktuelle Formation</span><span>' + club.formation.template + '</span></div>' +
      '<div class="kv"><span>Aufgestellte Spieler</span><span>' + Object.keys(club.formation.slots).length + ' / ' + FORMATIONS[club.formation.template].length + '</span></div>' +
      '<div style="margin-top:18px;"><button class="btn btn-danger" id="deleteClubBtn">Verein auflösen</button></div>';
    dangerCard.querySelector("#deleteClubBtn").addEventListener("click", function(){
      if(confirm('„' + club.name + '“ wirklich auflösen? Kader und Aufstellung gehen verloren.')){
        state.clubs = state.clubs.filter(function(c){ return c.id!==club.id; });
        persist();
        session.clubId = null;
        render();
        showToast("Verein aufgelöst.");
      }
    });

    wrap.appendChild(infoCard);
    wrap.appendChild(dangerCard);
    return wrap;
  }

  /* ============ Export / Import ============ */
  function exportData(){
    var ts = new Date().toISOString().slice(0,10);
    var filename = "kadermeister-daten-" + ts + ".json";
    var jsonStr = JSON.stringify(state, null, 2);

    function fallbackDownload(){
      var blob = new Blob([jsonStr], { type: "application/json" });
      var url = URL.createObjectURL(blob);
      var a = document.createElement("a");
      a.href = url;
      a.download = filename;
      document.body.appendChild(a);
      a.click();
      a.remove();
      setTimeout(function(){ URL.revokeObjectURL(url); }, 1000);
      showToast("Daten wurden heruntergeladen.");
    }

    if(window.claude && typeof window.claude.use === "function"){
      window.claude.use("downloads").then(function(downloads){
        if(!downloads){ fallbackDownload(); return; }
        downloads.save({ filename: filename, data: jsonStr }).then(function(){
          showToast("Daten wurden heruntergeladen.");
        }).catch(function(err){
          showToast(err && err.code === "declined" ? "Download abgebrochen." : "Download fehlgeschlagen.");
        });
      }).catch(function(){ fallbackDownload(); });
    } else {
      fallbackDownload();
    }
  }

  function importDataFromFile(file){
    var reader = new FileReader();
    reader.onload = function(e){
      try {
        var parsed = JSON.parse(e.target.result);
        if(!parsed || !Array.isArray(parsed.vms) || !Array.isArray(parsed.clubs)){
          throw new Error("invalid format");
        }
        state = parsed;
        ensureSeedUser();
        persist();
        session.vmId = null;
        session.clubId = null;
        render();
        showToast("Daten wurden erfolgreich importiert.");
      } catch(err){
        showToast("Datei konnte nicht gelesen werden – ungültiges Format.");
      }
    };
    reader.readAsText(file);
  }

  function triggerImport(){
    var input = document.createElement("input");
    input.type = "file";
    input.accept = "application/json";
    input.addEventListener("change", function(){
      if(input.files && input.files[0]) importDataFromFile(input.files[0]);
    });
    input.click();
  }

  /* ============ Test-Zugang ============ */
  function ensureSeedUser(){
    var exists = state.vms.some(function(v){ return v.username.toLowerCase()==="karl heinz"; });
    if(!exists){
      state.vms.push({ id: uid(), name: "Karl Heinz", username: "Karl Heinz", password: "1212x" });
      persist();
    }
  }

  /* ============ Start ============ */
  loadState(function(){
    ensureSeedUser();
    render();
  });
})();
</script>
